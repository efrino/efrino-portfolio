# Coolify deployment. Domains are set in the Coolify UI for the "web" service;
# Coolify generates the Traefik routing and Let's Encrypt certificates.
# Set GROQ_API_KEY and GEMINI_API_KEY (both free) in Coolify's Environment Variables.
services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      - DOMAIN=efrino.web.id
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LEADS_TOKEN=${LEADS_TOKEN}
      - DATA_DIR=/data
    volumes:
      - portfolio-data:/data
    expose: ["3000"]

  # Private job/project radar (radar.efrino.web.id). Reads jasa leads read-only.
  radar:
    build:
      context: .
      dockerfile: radar/Dockerfile
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RADAR_PASSWORD=${RADAR_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LEADS_FILE=/leads/leads.jsonl
      - REPORT_WA_FROM=${REPORT_WA_FROM}
      - REPORT_WA_TO=${REPORT_WA_TO}
    volumes:
      - radar-data:/data
      - portfolio-data:/leads:ro
    expose: ["3000"]

volumes:
  portfolio-data: {}
  radar-data: {}
