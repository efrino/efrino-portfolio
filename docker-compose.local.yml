name: efrino-portfolio

services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      - DOMAIN=efrino.web.id
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.efrino-http.rule=Host(`efrino.web.id`) || Host(`www.efrino.web.id`) || Host(`ai.efrino.web.id`) || Host(`shop.efrino.web.id`) || Host(`admin.efrino.web.id`) || Host(`notes.efrino.web.id`) || Host(`api.efrino.web.id`) || Host(`story.efrino.web.id`) || Host(`github.efrino.web.id`) || Host(`linkedin.efrino.web.id`)"
      - traefik.http.routers.efrino-http.entrypoints=http
      - traefik.http.routers.efrino-http.middlewares=efrino-https
      - traefik.http.middlewares.efrino-https.redirectscheme.scheme=https
      - "traefik.http.routers.efrino.rule=Host(`efrino.web.id`) || Host(`www.efrino.web.id`) || Host(`ai.efrino.web.id`) || Host(`shop.efrino.web.id`) || Host(`admin.efrino.web.id`) || Host(`notes.efrino.web.id`) || Host(`api.efrino.web.id`) || Host(`story.efrino.web.id`) || Host(`github.efrino.web.id`) || Host(`linkedin.efrino.web.id`)"
      - traefik.http.routers.efrino.entrypoints=https
      - traefik.http.routers.efrino.tls=true
      - traefik.http.routers.efrino.tls.certresolver=letsencrypt
      - traefik.http.routers.efrino.middlewares=efrino-gzip
      - traefik.http.middlewares.efrino-gzip.compress=true
      - traefik.http.middlewares.efrino-gzip.compress.excludedcontenttypes=application/x-ndjson
      - traefik.http.services.efrino.loadbalancer.server.port=3000


networks:
  coolify: { external: true }

